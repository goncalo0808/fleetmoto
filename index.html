<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gestão de frotas, motociclos, ocorrências e intervenções da CM Motos.">
    <meta name="theme-color" content="#17211d">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./assets/images/icon.svg" type="image/svg+xml">
    <title>Fleet Moto | CM Motos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="./assets/css/styles.css" rel="stylesheet">
</head>
<body>
    <section class="auth-wrap" id="auth-view">
        <div class="auth-panel">
            <a class="d-flex align-items-center gap-2 mb-4 text-decoration-none text-dark" href="./" aria-label="Fleet Moto">
                <span class="brand-mark">FM</span><span class="brand">FLEET MOTO</span>
            </a>
            <div class="section-kicker mb-2">CM Motos · Gestão de frota</div>
            <h1 class="mb-2">Aceder à aplicação</h1>
            <p class="body-copy mb-4">Entre com a sua conta de técnico ou administrador.</p>
            <div class="alert d-none" id="auth-message" role="alert"></div>
            <form id="auth-form">
                <div class="mb-3">
                    <label class="form-label" for="auth-email">Email</label>
                    <input class="form-control" id="auth-email" type="email" autocomplete="email" required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="auth-password">Palavra-passe</label>
                    <input class="form-control" id="auth-password" type="password" autocomplete="current-password" minlength="6" required>
                </div>
                <button class="btn btn-primary w-100 py-2" id="auth-submit" type="submit">Entrar</button>
            </form>
        </div>
    </section>

    <div id="app-view" class="d-none">
        <header class="app-header">
            <div class="container d-flex align-items-center justify-content-between py-3 gap-3">
                <a class="d-flex align-items-center gap-2 text-decoration-none" href="./" aria-label="Fleet Moto, início">
                    <span class="brand-mark">FM</span><span class="brand">FLEET MOTO</span>
                </a>
                <div class="d-flex align-items-center gap-3">
                    <span class="account-label d-none d-sm-inline" id="account-label"></span>
                    <button class="btn btn-sm btn-outline-light" id="sign-out" type="button">Sair</button>
                </div>
            </div>
        </header>
        <main class="app-main">
            <div class="container">
                <div class="alert d-none" id="app-message" role="alert"></div>
                <div class="row g-4">
                    <aside class="col-md-3 col-lg-2 app-sidebar" aria-label="Módulos">
                        <div class="module-nav" id="module-nav"></div>
                    </aside>
                    <section class="col-12 col-md-9 col-lg-10" aria-live="polite">
                        <div class="mobile-modules">
                            <label class="visually-hidden" for="module-select">Módulo</label>
                            <select class="form-select" id="module-select"></select>
                        </div>
                        <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
                            <div><div class="section-kicker">Operação</div><h1 class="panel-title mb-0" id="module-title">A carregar</h1></div>
                            <div class="d-flex gap-2">
                                <input class="form-control" id="table-search" type="search" placeholder="Pesquisar" aria-label="Pesquisar registos">
                                <button class="btn btn-primary text-nowrap" id="add-record" type="button">+ Novo registo</button>
                            </div>
                        </div>
                        <div class="data-panel table-wrap">
                            <table class="table table-hover mb-0">
                                <thead id="table-head"></thead>
                                <tbody id="table-body"></tbody>
                            </table>
                            <div class="p-4 text-secondary" id="empty-state">A carregar dados…</div>
                        </div>
                    </section>
                </div>
            </div>
        </main>
    </div>

    <div class="modal fade" id="record-modal" tabindex="-1" aria-labelledby="record-modal-title" aria-hidden="true">
        <div class="modal-dialog modal-dialog-scrollable">
            <div class="modal-content">
                <form id="record-form">
                    <div class="modal-header">
                        <h2 class="modal-title fs-5" id="record-modal-title">Novo registo</h2>
                        <button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Fechar"></button>
                    </div>
                    <div class="modal-body" id="record-fields"></div>
                    <div class="modal-footer">
                        <button class="btn btn-outline-secondary" type="button" data-bs-dismiss="modal">Cancelar</button>
                        <button class="btn btn-primary" id="save-record" type="submit">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="./supabase-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script type="module" src="./app.js"></script>
</body>
</html>
